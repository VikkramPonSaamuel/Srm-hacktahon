version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: srm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srm_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-srm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srm_user} -d ${POSTGRES_DB:-srm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
